name: Contribution graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate theme-aware contribution grids
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-grid-dark.svg?palette=github-dark&color_snake=#3ECF8E&color_dots=#161B22,#164B32,#217A4F,#2FB872,#3ECF8E
            dist/contribution-grid-light.svg?palette=github&color_snake=#167A55&color_dots=#EBEDF0,#C7E9D7,#81D2A8,#38A875,#167A55

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
